name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          manifest-path: ros/pixi.toml
          environments: default viz
          locked: true
      - name: Install Linux render libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6 libegl1 libgl1
          echo "MUJOCO_GL=egl" >> "$GITHUB_ENV"
      - run: uv sync --locked
      - run: pixi run --locked --manifest-path ros/pixi.toml build-interfaces
      - name: Measure camera-enabled bridge for 60 seconds per mode
        run: uv run pytest tests/test_bridge_performance.py -v -rP --junitxml=out/bridge-performance.xml -o junit_logging=all
      - name: Upload bridge measurement windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-performance-${{ matrix.os }}
          path: out/bridge-performance.xml
      - run: uv run pytest -rP --ignore=tests/test_bridge_performance.py
