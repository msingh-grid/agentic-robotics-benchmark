[project]
name = "agentic-robotics-benchmark"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "msgpack>=1.2.4",
    "mujoco>=3.17.0",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "pyzmq>=27.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
